# hifi-wifi Configuration
# Place this file at: /etc/hifi-wifi/config.toml
# All settings are optional - defaults are used if omitted

[global]
tick_rate_secs = 2  # Governor loop interval

[power]
enabled = true
# wlan_power_save options:
#   "adaptive" (default) - Auto-disable on AC power, enable on battery when idle
#   "off" - ALWAYS disabled (fixes Issue #16 - keeps power save OFF permanently)
#   "on" - ALWAYS enabled (battery saving, may cause lag)
wlan_power_save = "adaptive"

# Force power save and EEE ON if battery drops below this threshold (0-100)
# Helps prevent the device from dying in the middle of gameplay.
# Set to 0 to disable critical battery override.
critical_battery_pct = 15

# Automatically toggles PCIe Active State Power Management (ASPM) at runtime:
#   true (default) - Disable ASPM for 0ms wakeup latency during Game Mode, restore to auto when idle
#   false - Keep initial static system ASPM configuration
dynamic_aspm = true

[wifi]
enabled = true
# Signal thresholds for band steering (dBm)
min_signal_2g_dbm = -75
min_signal_5g_dbm = -72
min_signal_6g_dbm = -70
# Band bias (higher = more preference)
band_bias_5ghz = 15
band_bias_6ghz = 25
# Custom MAC address override (optional):
#   "permanent" - Uses the permanent hardware MAC address (disables randomization)
#   "stable" - Random but stable MAC per network profile
#   "00:11:22:33:44:55" - Enforces a specific custom MAC address
# wifi_mac_address = "permanent"

[system]
sysctl_enabled = true
irq_affinity_enabled = true
driver_tweaks_enabled = true
# Force a custom system hostname (optional, sent to routers via DHCP for local DNS resolution)
# hostname = "steamdeck"

[backend]
# Disable iwd's periodic scanning for reduced latency
iwd_periodic_scan_disable = true

[governor]
# Breathing CAKE (shaper rate from the Wi-Fi link rate). Superseded by [autorate], which
# measures latency instead of guessing; only used when autorate.mode = "off".
breathing_cake_enabled = false
cake_median_window = 3
cake_change_threshold_mbit = 15
cake_change_threshold_pct = 0.15
cake_overhead_factor = 0.85
cake_hysteresis_up = 3    # Slow increases (prevent oscillation)
cake_hysteresis_down = 1  # Fast decreases (prevent bufferbloat)

# Intermediate Functional Block (IFB) redirection for ingress (download) shaping.
# Keeps the root physical interface qdisc as mq (preserving EDCA) while shaping in software.
qos_use_ifb = true

# Internet limits (Mbit/s). Optional. Autorate finds the bottleneck on its own; if set,
# these become autorate's upper bounds and starting rates.
# internet_download_mbit = 100
# internet_upload_mbit = 20

# Game Mode Detection
game_mode_enabled = true
game_mode_pps_threshold = 200
game_mode_cooldown_secs = 30
game_mode_freeze_cake = true

# Mark game / game-streaming UDP as DSCP EF: our transmissions use the Wi-Fi voice/video
# queue and CAKE's latency tin. Matches source or destination port, IPv4 and IPv6, plus
# everything in gamescope.slice (SteamOS / Bazzite game mode). Needs `nft`.
game_priority_enabled = true
game_priority_udp_ports = ["27000-27100", "47998-48010"]  # Steam, Moonlight/Sunshine

# CPU Governor (coalescing)
cpu_coalescing_enabled = true
cpu_coalescing_threshold = 0.7
cpu_avg_window_size = 5

# Band Steering
band_steering_enabled = true
band_steering_hysteresis_ticks = 3
band_steering_min_improvement = 10

# Suppress background scanning to eliminate latency spikes (at the expense of roaming)
#   false (default) - Roaming enabled, allows background scans
#   true - Lowest latency, disables roaming (recommended for stationary/online gaming)
scan_suppress = false

[autorate]
# Latency-driven bufferbloat control. Pings the reflectors, and when latency rises while
# this device is saturating the link, lowers the shaper to just under the real bottleneck
# (ISP line or Wi-Fi). Raises it again while latency stays clean.
#   "busy"   - shape only while the link carries traffic (default; no cost when idle)
#   "always" - keep the shaper installed whenever connected
#   "off"    - disable (falls back to breathing_cake_enabled)
mode = "busy"
reflectors = ["1.1.1.1", "8.8.8.8", "9.9.9.9"]   # IP addresses; half must agree on bloat
ping_interval_ms = 300          # per reflector, while shaping
idle_ping_interval_ms = 2000    # while idle, keeps the latency baseline clean (0 = off)
delay_threshold_ms = 15.0       # smoothed latency increase that counts as bloat
min_download_mbit = 5.0         # never shape below these
min_upload_mbit = 1.0
# max_download_mbit = 300.0     # default: governor.internet_*_mbit, else the link rate
# max_upload_mbit = 30.0
remember_rates = true           # remember learned rates and baselines per Wi-Fi network
